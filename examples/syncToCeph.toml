# Load with --config examples/syncToCeph.toml, or create local defaults with config init.
# config show displays effective directories; config set KEY VALUE changes defaults.
# Relative paths resolve from the working directory; config init/set save absolute paths.
source = "/mnt/d/luminoseData"
dest = "/mnt/ceph/LuminoseFM/LuminoseDataCeph"
# Use an absolute path when sharing this config across working directories.
state_dir = ".synctoceph-state"
# Automatic: /mnt/ceph for the built-in destination, no guard for a custom dest.
# Set an explicit mount path to guard a custom destination.
require_mount = ""
dry_run = false

# Configure at most one schedule; schedule requires a CLI or configured value.
# CLI --at or --interval overrides the configured schedule.
interval = "4h"
# at = "02:00"
