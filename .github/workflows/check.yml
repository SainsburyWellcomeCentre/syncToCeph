# Runs ./scripts/check.sh (formatting, linting, tests, script checks, docs)
# on every push and pull request.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install rsync and shellcheck
        run: sudo apt-get update && sudo apt-get install -y rsync shellcheck
      - name: Run all checks
        run: ./scripts/check.sh
